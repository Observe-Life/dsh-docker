# 自建 dsh 镜像构建流水线
# 触发方式：仅手动（在仓库 Actions 页点 Run workflow，填官方 dsh 版本号）
# 设计约定：不自动跟踪官方更新——要不要跟、何时跟，由使用者手动决定
name: build-image

on:
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '官方 dsh 版本号（npm 包 @deepseek-ai/dsh 的版本，如 0.2.2-rc.5）'
        required: true
        default: '0.2.2-rc.5'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 校验该版本存在于官方 npm
        run: |
          VERSION="${{ inputs.dsh_version }}"
          META=$(curl -sf "https://registry.npmjs.org/@deepseek-ai/dsh/${VERSION}") \
            || { echo "官方 npm 上不存在版本 ${VERSION}，终止"; exit 1; }
          echo "官方包元数据校验通过：$(echo "$META" | head -c 120)..."

      - name: 计算镜像名（GHCR 要求全小写）
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dsh" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: DSH_VERSION=${{ inputs.dsh_version }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ inputs.dsh_version }}
            ${{ steps.img.outputs.name }}:latest

      - name: 构建结果
        run: |
          echo "镜像已发布："
          echo "  ${{ steps.img.outputs.name }}:${{ inputs.dsh_version }}"
          echo "  ${{ steps.img.outputs.name }}:latest"
